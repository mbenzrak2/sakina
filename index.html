<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سَكينة — أذكار وقرآن</title>
  <meta name="description" content="أذكار حصن المسلم، القرآن الكريم، ووِرد يومي مع سجلّ كامل — يعمل بدون إنترنت.">
  <meta name="theme-color" content="#08100e">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="سَكينة">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/tajawal-arabic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/amiri-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // apply the saved theme before first paint (mirror of the IndexedDB setting)
    try {
      var t = localStorage.getItem('sakina-theme') || 'dark';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/adhkar.css">
  <link rel="stylesheet" href="css/quran.css">
  <link rel="stylesheet" href="css/checklist.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="التنقل الرئيسي"><div class="tabbar-inner" id="tabs"></div></nav>
  </div>
  <noscript><p style="padding:24px;text-align:center">يحتاج هذا التطبيق إلى تفعيل JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
